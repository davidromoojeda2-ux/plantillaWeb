services:
  # ─── Aplicación Web ASP.NET Core ──────────────────────────────────────────
  # Base de datos: MongoDB Atlas (externa, no requiere contenedor local)
  web:
    image: ${DOCKER_IMAGE:-ghcr.io/davidromoojeda2-ux/plantillaweb:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portal_web
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-5000}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - Site__BaseUrl=${SITE_BASE_URL:-}
      - MongoDB__ConnectionString=${MONGO_CONNECTION_STRING}
      - MongoDB__DatabaseName=${MONGO_DB:-portal_noticias}
      - Storage__Provider=${STORAGE_PROVIDER:-Local}
      - LocalStorage__BaseUrl=/uploads
      - CloudflareR2__AccountId=${R2_ACCOUNT_ID:-}
      - CloudflareR2__AccessKeyId=${R2_ACCESS_KEY_ID:-}
      - CloudflareR2__SecretAccessKey=${R2_SECRET_ACCESS_KEY:-}
      - CloudflareR2__BucketName=${R2_BUCKET_NAME:-portal-noticias}
      - CloudflareR2__PublicDomain=${R2_PUBLIC_DOMAIN:-}
    volumes:
      # Persistencia de imágenes subidas cuando se usa almacenamiento local
      - ./uploads:/app/wwwroot/uploads
    networks:
      - app_network

networks:
  app_network:
    name: portal_network
    driver: bridge
