name: CI/CD Pipeline - Validacion, Docker y Despliegue VPS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── 1. Validación Rápida de Código (Fast Feedback CI) ──────────────────────
  validate-code:
    name: Validar Compilacion y Estilos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: paginaWeb/pnpm-lock.yaml

      - name: Instalar dependencias frontend y compilar Tailwind CSS
        working-directory: ./paginaWeb
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:css

      - name: Configurar .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias NuGet
        run: dotnet restore paginaWeb.slnx

      - name: Compilar solución (.NET 10)
        run: dotnet build paginaWeb.slnx -c Release --no-restore -p:SkipTailwind=true

  # ─── 2. Construcción y Publicación de Imagen Docker ─────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    needs: validate-code
    runs-on: ubuntu-latest
    # Solo publica la imagen si el commit es en 'main' o ejecución manual
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Formatear nombre de imagen en minúsculas
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadatos de Docker (tags y etiquetas)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── 3. Despliegue Automatizado con Smoke Test en VPS ───────────────────────
  deploy:
    name: Deploy & Healthcheck en VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_PORT: ${{ secrets.SSH_PORT || 22 }}

    steps:
      - name: Formatear nombre de imagen en minúsculas
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # ─── Opción Dokploy: Despliegue Ultrarrápido por Webhook (Sin SSH) ────────
      - name: Disparar Despliegue en Dokploy vía Webhook
        if: env.DOKPLOY_WEBHOOK_URL != ''
        run: |
          echo "==> Notificando a Dokploy para descargar la nueva imagen Docker..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${DOKPLOY_WEBHOOK_URL}" || true)
          echo "Respuesta inicial del Webhook (POST): HTTP $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "==> [EXITO] Dokploy ha recibido la señal y comenzo a desplegar la imagen en el VPS."
          else
            echo "==> [REINTENTO] Intentando llamada GET al Webhook..."
            HTTP_STATUS_GET=$(curl -s -o /dev/null -w "%{http_code}" "${DOKPLOY_WEBHOOK_URL}" || true)
            if [ "$HTTP_STATUS_GET" -ge 200 ] && [ "$HTTP_STATUS_GET" -lt 300 ]; then
              echo "==> [EXITO] Dokploy ha recibido la señal y comenzo a desplegar la imagen en el VPS (GET)."
            else
              echo "==> [ERROR] No se pudo activar el Webhook de Dokploy. Codigo HTTP: $HTTP_STATUS_GET"
              exit 1
            fi
          fi

      # ─── Opción Tradicional: Conexión SSH directa al VPS (Fallback) ───────────
      - name: Checkout del repositorio para transferir configuración (SSH Fallback)
        uses: actions/checkout@v4
        if: env.DOKPLOY_WEBHOOK_URL == '' && env.SSH_HOST != ''

      - name: Transferir docker-compose.yml y .env.example al VPS
        uses: appleboy/scp-action@v0.1.7
        if: env.DOKPLOY_WEBHOOK_URL == '' && env.SSH_HOST != ''
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          port: ${{ env.SSH_PORT }}
          source: "docker-compose.yml,.env.example"
          target: "/opt/portal-noticias"

      - name: Desplegar y Verificar Salud del Servicio vía SSH
        uses: appleboy/ssh-action@v1.2.0
        if: env.DOKPLOY_WEBHOOK_URL == '' && env.SSH_HOST != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          IMAGE_PATH: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          port: ${{ env.SSH_PORT }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR,IMAGE_PATH
          script: |
            set -e
            cd /opt/portal-noticias

            # 1. Asegurar archivo .env con valores base si es la primera ejecución
            if [ ! -f .env ]; then
              cp .env.example .env
              sed -i "s|DOCKER_IMAGE=.*|DOCKER_IMAGE=$IMAGE_PATH|g" .env
              echo "[INFO] Archivo .env inicial creado en /opt/portal-noticias/.env."
            fi

            # 2. Autenticar en GHCR y descargar imagen actualizada
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            docker compose pull web

            # 3. Levantar contenedores
            docker compose up -d --remove-orphans

            # 4. Obtener puerto configurado en .env (por defecto 5000)
            APP_PORT=$(grep -E '^HOST_PORT=' .env | cut -d '=' -f2 | tr -d ' \r\n' || echo "5000")
            [ -z "$APP_PORT" ] && APP_PORT="5000"

            # 5. Smoke Test / Verificación de Salud Post-Despliegue
            echo "==> Iniciando Smoke Test: verificando respuesta en http://127.0.0.1:$APP_PORT/ ..."
            HEALTHY=0
            for i in $(seq 1 15); do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 3 "http://127.0.0.1:$APP_PORT/" || true)
              echo "Intento $i/15: Código de respuesta HTTP: [$HTTP_CODE]"
              
              # Aceptamos 200 (OK), 301/302 (Redirección normal)
              if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "301" ] || [ "$HTTP_CODE" = "302" ]; then
                echo "==> [EXITO] La aplicacion web responde correctamente (HTTP $HTTP_CODE)."
                HEALTHY=1
                break
              fi
              sleep 2
            done

            if [ "$HEALTHY" -ne 1 ]; then
              echo "==> [ERROR CRITICO] La aplicacion no respondio satisfactoriamente en 30 segundos."
              echo "==> Volcando los ultimos 60 logs del contenedor web:"
              docker compose logs --tail=60 web
              exit 1
            fi

            # 6. Limpieza preventiva de imagenes Docker antiguas en deshuso
            docker image prune -f
            echo "==> Despliegue completado y verificado con exito."
